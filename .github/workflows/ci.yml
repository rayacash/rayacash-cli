name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/sync-version.mjs --check
      # dist se commitea (la instalación desde GitHub no compila): tiene que ser el de src.
      - name: dist está al día con src
        run: |
          npm run compile
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Los tests nunca salen de la máquina: la API y tu servidor son falsos, en 127.0.0.1.
      - run: npm test
      # El paquete con el dist commiteado, instalado desde el .tgz y corrido.
      - run: node scripts/check-package.mjs

  package:
    name: Cobertura y paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run check:package
      - name: El paquete trae solo dist y los docs
        run: npm pack --dry-run

  install-from-github:
    name: Instalación desde GitHub (${{ matrix.os }})
    # Como lo instala quien sigue el README: el commit tiene que estar en GitHub (un push).
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Sin scripts de build ni prepare: npm toma el dist commiteado, sin compilar ni bajar nada.
      - run: npm install -g "github:${{ github.repository }}#${{ github.sha }}"
      - run: rayacash --version
      - run: rayacash-cli --help
      - name: Los .cmd de Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call rayacash.cmd --version
          call rayacash-cli.cmd --help
      # Sin `npx github:…`: npm 10 no puede correrlo con un paquete de git («GitFetcher requires
      # an Arborist constructor to pack a tarball») y el README no lo ofrece. npx se usa desde npm.
